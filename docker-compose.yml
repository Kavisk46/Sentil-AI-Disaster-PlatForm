# SentinelAI local development stack — Sprint 1 (engineering foundation).
#
# Runs the frontend and backend together, each built from its own Dockerfile
# under docker/. No database or cache is provisioned yet: Sprint 1 is
# deliberately backend/frontend plumbing only, with no persistence layer.
# Postgres/PostGIS will be introduced here alongside the domain models in
# Phase 2 — see PROJECT_ROADMAP.md.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: sentinelai-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      # Compose's service DNS name, so the API's CORS allow-list can include
      # the frontend even though it isn't reachable at localhost internally.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: sentinelai-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
